# com_v4: agente público (base_comunidad) + skill repomap: primero el mapa del repo (clases con firmas y funciones
# de los archivos más relacionados con el issue). Nombre del agente = nombre de la skill (lección v4). Resto idéntico.
# Origen: the public community single agent
# ("gemma-4-harness-fixed-single-agent", Kaggle sample notebook), same tools as published,
# same sampling and budgets as nervo v4. Only the prompt differs.
name: repomap
model: gemma-4-e4b-it-qat-w4a16-ct
instruction: !include prompts/system.md
tools:
  - run_command
  - read_file
  - edit_file
  - write_file
  - get_status
  - submit_patch
  - get_code_neighbors
  - search_similar_code
  - get_code_subgraph
generate_content_config: !include configs/sampling.yaml
skills:
  - skills/repomap
