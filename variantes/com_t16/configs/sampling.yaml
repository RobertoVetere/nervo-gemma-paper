# com_t16: agente público con E4B y más presupuesto de razonamiento (12288 en lugar de 4096).
# Motivo: sondas one shot del 10-nov (lab/oneshot/cadena3.jsonl): E4B razonando sin tope resolvió 9/22 frente a 5/22
# sin razonar, y 9 de sus 17 aciertos usaron más de 4096 tokens. max_output_tokens 14336 para que
# entrada (hasta ~16k) + salida quepa en los 32768 de vLLM.
temperature: 0.2
top_p: 0.95
max_output_tokens: 14336
thinking_config:
  thinking_budget: 12288
  include_thoughts: true
