# Experimento A/B (8-nov): agente público de la comunidad SIN cambios, solo el modelo 31B.
# Compara con el envío 1 (nervo_repro 31B, 0,18): ¿el problema es el prompt o el 31B/tiempo?
# Baseline for comparison: the public community single agent
# ("gemma-4-harness-fixed-single-agent", Kaggle sample notebook), same tools as published,
# same sampling and budgets as nervo v4. Only the prompt differs.
name: swe_agent
model: gemma-4-31b-it-qat-w4a16-ct
instruction: !include prompts/system.md
tools:
  - run_command
  - read_file
  - edit_file
  - write_file
  - get_status
  - submit_patch
  - get_code_neighbors
  - search_similar_code
  - get_code_subgraph
generate_content_config: !include configs/sampling.yaml
