name: Recoger resultados de Modal
# Baja del volumen nervo-datos los resultados de las ejecuciones lanzadas sin esperar y los guarda en resultados/.
on:
  workflow_dispatch:
    inputs:
      nombre:
        description: "Prefijo del resultado (etiqueta-runid); vacío = solo listar"
        default: ""
jobs:
  recoger:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install modal==1.6.3
      - name: Listar y bajar
        run: |
          modal volume ls nervo-datos resultados/ || true
          [ -n "${{ inputs.nombre }}" ] || exit 0
          mkdir -p bajado
          for f in $(modal volume ls nervo-datos resultados/ 2>/dev/null | grep -o "${{ inputs.nombre }}[^ ]*\.tar\.gz" | sort -u); do
            modal volume get nervo-datos "resultados/$f" bajado/ --force
          done
          ls -la bajado
      - name: Guardar en resultados/
        if: inputs.nombre != ''
        run: |
          mkdir -p resultados
          for t in bajado/*.tar.gz; do
            [ -f "$t" ] || continue
            n=$(basename "$t" .tar.gz); d="x_$n"; mkdir -p "$d"; tar xzf "$t" -C "$d"
            f=$(find "$d" -name nervo_results.json | head -1)
            [ -n "$f" ] && cp "$f" "resultados/$n-modal.json" && python3 - "$f" <<'E'
          import json, sys
          r = json.load(open(sys.argv[1]))
          print('stage:', r.get('stage'), '| error:', r.get('error'))
          for t in r.get('tasks', []):
              print(('OK ' if t.get('resolved') else 'NO '), t.get('variant'), t['id'], 'calls', t.get('tool_calls'), 't', t.get('duration_s'), t.get('error') or '')
          E
          done
          git config user.name "nervo-bot"; git config user.email "nervo-bot@users.noreply.github.com"
          git add resultados && git commit -m "Resultados Modal: ${{ inputs.nombre }}" && git pull --rebase -q && git push -q || true
      - uses: actions/upload-artifact@v4
        if: inputs.nombre != ''
        with:
          name: salida-modal
          path: x_*
