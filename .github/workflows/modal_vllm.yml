name: vLLM server on Modal
# Deploys (or stops) a model as an OpenAI-compatible API on Modal (local/modal_vllm.py). Scales to zero after 5 idle minutes.
on:
  workflow_dispatch:
    inputs:
      model:
        description: "Key of MODELOS in local/modal_vllm.py, e.g. gemma-4-e4b-it-qat-w4a16-ct, gemma-4-e4b-it (bf16), qwen3-4b-awq"
        default: "gemma-4-e4b-it-qat-w4a16-ct"
      app:
        description: "logs only: app name"
        default: "nervo-vllm-e4b"
      suffix:
        description: "app-name suffix for a second copy of the same model (e.g. -b)"
        default: ""
      gpus:
        description: "Number of L4 GPUs (E4B: 1; 31B: 4)"
        default: "1"
      action:
        description: "deploy | stop | logs"
        default: "deploy"
jobs:
  server:
    runs-on: ubuntu-latest
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      NERVO_VLLM_MODELO: ${{ inputs.model }}
      NERVO_VLLM_GPUS: ${{ inputs.gpus }}
      NERVO_VLLM_SUFIJO: ${{ inputs.suffix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install modal==1.6.3
      - name: Check the environment (no GPU)
        if: inputs.action == 'deploy'
        run: modal run local/modal_vllm.py::solo_comprobar
      - name: Deploy
        if: inputs.action == 'deploy'
        run: modal deploy local/modal_vllm.py
      - name: Stop
        if: inputs.action == 'stop'
        run: modal app stop -y "${{ inputs.app }}"
      - name: Logs
        if: inputs.action == 'logs'
        run: |
          modal app list --json || modal app list || true
          timeout 90 modal app logs "${{ inputs.app }}" > logs.txt 2>&1 || true
          tail -c 20000 logs.txt
      - uses: actions/upload-artifact@v4
        if: inputs.action == 'logs'
        with:
          name: modal-logs
          path: logs.txt
