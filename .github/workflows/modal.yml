name: Evaluar en Modal (4x L4)
# Mismo kernel que "Evaluar en Kaggle (L4)", pero en Modal: sin cuota semanal, pago por segundo.
# Necesita los secretos MODAL_TOKEN_ID y MODAL_TOKEN_SECRET (y los de Kaggle para descargar las tareas oficiales).
on:
  workflow_dispatch:
    inputs:
      variant:
        description: "Variantes: ',' = mismo contenedor (en serie); ';' = contenedores distintos (en paralelo)"
        required: true
      tasks:
        description: "Ids de tareas separados por comas"
        required: true
      model:
        description: "Modelo (vacío = el que declare la variante)"
        default: ""
      banco:
        description: "1 = banco nuevo (snapshots desde GitHub); 0 = tareas oficiales de la competición"
        default: "0"
      label:
        description: "Etiqueta de la ejecución"
        default: "modal"
      esperar:
        description: "0 = lanzar y salir (no gasta minutos de Actions; recoger con 'Recoger resultados de Modal'); 1 = esperar"
        default: "0"
jobs:
  evaluar:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    defaults:
      run:
        shell: bash -eo pipefail {0}
    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN || secrets.KAGGLE_KEY }}
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install modal==1.6.3 kaggle six pyyaml
      - name: Comprobar secretos
        run: |
          [ -n "$MODAL_TOKEN_ID" ] && [ -n "$MODAL_TOKEN_SECRET" ] || { echo "::error::faltan los secretos MODAL_TOKEN_ID / MODAL_TOKEN_SECRET"; exit 1; }
      - name: Harness oficial (swegemma, adk_submission, adk_eval_core)
        run: |
          mkdir -p modal_wheels
          kaggle datasets files metric/gemma-4-developer-agent-wheelhouse --page-size 200 > wh.txt
          for w in $(awk '{print $1}' wh.txt | grep -E '^(swegemma|adk_submission|adk_eval_core)-.*\.whl$'); do
            kaggle datasets download metric/gemma-4-developer-agent-wheelhouse -f "$w" -p modal_wheels -q
          done
          ls -la modal_wheels
      - name: Caché de datos de la competición (recuperar)
        uses: actions/cache/restore@v4
        with:
          path: datos
          key: datos-v1-${{ github.run_id }}
          restore-keys: datos-v1-
      - name: Datos de las tareas
        run: |
          python3 local/preparar_datos_modal.py --tareas "${{ inputs.tasks }}" ${{ inputs.banco == '1' && '--banco' || '' }} --out datos.tar
      - name: Caché de datos de la competición (guardar ya, aunque luego falle algo)
        uses: actions/cache/save@v4
        with:
          path: datos
          key: datos-v1-${{ github.run_id }}
      - name: Renderizar el kernel
        run: |
          # Un kernel por variante (o por repetición, si una variante se repite en la lista): cada uno va a su contenedor.
          MODEL_ARG=""; [ -n "${{ inputs.model }}" ] && MODEL_ARG="--model ${{ inputs.model }}"
          KERNELS=""; i=0
          # ';' separa contenedores; ',' pone varias variantes en el MISMO contenedor (un solo vLLM, una tras otra).
          for v in $(echo "${{ inputs.variant }}" | tr ';' ' '); do
            python3 scripts/render_kernel.py --out kernel_$i --variant "$v" --tasks "${{ inputs.tasks }}" \
              --n-tasks 0 --label "${{ inputs.label }}-$i" $MODEL_ARG
            KERNELS="$KERNELS${KERNELS:+,}kernel_$i/nervo_eval.py"; i=$((i+1))
          done
          echo "KERNELS=$KERNELS" >> $GITHUB_ENV
          V="${{ inputs.variant }}"; V="${V%%;*}"; V="${V%%,*}"
          MODELO="${{ inputs.model }}"
          [ -z "$MODELO" ] && MODELO=$(sed -n 's/^model:[[:space:]]*//p' "$V/agent.yaml" | head -1 | tr -d '"\r ')
          echo "modelo: $MODELO"
          echo "MODELO=$MODELO" >> $GITHUB_ENV
          ls kernel_*
      - name: Comprobar el entorno en Modal (sin GPU)
        run: modal run local/modal_eval.py::solo_comprobar
      - name: Subir los datos al volumen de Modal (una vez para todos los contenedores)
        run: |
          modal volume create nervo-datos 2>/dev/null || true
          modal volume put nervo-datos datos.tar "datos-${{ github.run_id }}.tar" --force
      - name: Ejecutar en Modal
        run: |
          if [ "${{ inputs.esperar }}" = "1" ]; then
            modal run local/modal_eval.py::main --kernel "$KERNELS" --datos "datos-${{ github.run_id }}.tar" --modelo "$MODELO" --out salida
          else
            modal run --detach local/modal_eval.py::main --kernel "$KERNELS" --datos "datos-${{ github.run_id }}.tar" \
              --modelo "$MODELO" --esperar 0 --nombre "${{ inputs.label }}-${{ github.run_id }}"
          fi
      - name: Guardar resultados
        if: always()
        run: |
          mkdir -p resultados; hay=0
          for f in salida/*/salida/nervo_results.json; do
            [ -f "$f" ] || continue; hay=1
            i=$(echo "$f" | cut -d/ -f2)
            cp "$f" "resultados/${{ inputs.label }}-$i-modal-$(date -u +%Y%m%dT%H%M%SZ).json"
            python3 - "$f" <<'E'
          import json, sys
          r = json.load(open(sys.argv[1]))
          print('stage:', r.get('stage'), '| error:', r.get('error'))
          for t in r.get('tasks', []):
              print(('OK ' if t.get('resolved') else 'NO '), t.get('variant'), t['id'], 'calls', t.get('tool_calls'), 't', t.get('duration_s'), t.get('error') or '')
          E
          done
          if [ "$hay" = 1 ]; then
            git config user.name "nervo-bot"; git config user.email "nervo-bot@users.noreply.github.com"
            git add resultados && git commit -m "Resultados Modal: ${{ inputs.label }}" && git pull --rebase -q && git push -q || true
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: salida-modal
          path: salida
