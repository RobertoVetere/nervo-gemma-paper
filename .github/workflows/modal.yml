name: Evaluate on Modal (4x L4)
# Same kernel as "Evaluate on Kaggle (L4)", but on Modal: no weekly quota, pay per second.
# Needs the secrets MODAL_TOKEN_ID and MODAL_TOKEN_SECRET (and the Kaggle ones to download the official tasks).
on:
  workflow_dispatch:
    inputs:
      variant:
        description: "Variants: ',' = same container (in series); ';' = separate containers (in parallel)"
        required: true
      tasks:
        description: "Comma-separated task ids"
        required: true
      model:
        description: "Model (empty = the one the variant declares)"
        default: ""
      bench:
        description: "1 = validation bench (snapshots from GitHub); 0 = official competition tasks"
        default: "0"
      label:
        description: "Run label"
        default: "modal"
      wait:
        description: "0 = launch and exit (no Actions minutes spent; collect with 'Collect Modal results'); 1 = wait"
        default: "0"
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    defaults:
      run:
        shell: bash -eo pipefail {0}
    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN || secrets.KAGGLE_KEY }}
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install modal==1.6.3 kaggle six pyyaml
      - name: Check secrets
        run: |
          [ -n "$MODAL_TOKEN_ID" ] && [ -n "$MODAL_TOKEN_SECRET" ] || { echo "::error::missing secrets MODAL_TOKEN_ID / MODAL_TOKEN_SECRET"; exit 1; }
      - name: Official harness (swegemma, adk_submission, adk_eval_core)
        run: |
          mkdir -p modal_wheels
          kaggle datasets files metric/gemma-4-developer-agent-wheelhouse --page-size 200 > wh.txt
          for w in $(awk '{print $1}' wh.txt | grep -E '^(swegemma|adk_submission|adk_eval_core)-.*\.whl$'); do
            kaggle datasets download metric/gemma-4-developer-agent-wheelhouse -f "$w" -p modal_wheels -q
          done
          ls -la modal_wheels
      - name: Competition data cache (restore)
        uses: actions/cache/restore@v4
        with:
          path: comp_data
          key: comp-data-v1-${{ github.run_id }}
          restore-keys: comp-data-v1-
      - name: Task data
        run: |
          python3 local/prepare_modal_data.py --tasks "${{ inputs.tasks }}" ${{ inputs.bench == '1' && '--bench' || '' }} --dir comp_data --out data.tar
      - name: Competition data cache (save now, even if something fails later)
        uses: actions/cache/save@v4
        with:
          path: comp_data
          key: comp-data-v1-${{ github.run_id }}
      - name: Render the kernel
        run: |
          # One kernel per variant (or per replica, if a variant is repeated in the list): each goes to its own container.
          MODEL_ARG=""; [ -n "${{ inputs.model }}" ] && MODEL_ARG="--model ${{ inputs.model }}"
          KERNELS=""; i=0
          # ';' separates containers; ',' puts several variants in the SAME container (one vLLM, one after the other).
          for v in $(echo "${{ inputs.variant }}" | tr ';' ' '); do
            python3 scripts/render_kernel.py --out kernel_$i --variant "$v" --tasks "${{ inputs.tasks }}" \
              --n-tasks 0 --label "${{ inputs.label }}-$i" $MODEL_ARG
            KERNELS="$KERNELS${KERNELS:+,}kernel_$i/nervo_eval.py"; i=$((i+1))
          done
          echo "KERNELS=$KERNELS" >> $GITHUB_ENV
          V="${{ inputs.variant }}"; V="${V%%;*}"; V="${V%%,*}"
          MODEL="${{ inputs.model }}"
          [ -z "$MODEL" ] && MODEL=$(sed -n 's/^model:[[:space:]]*//p' "$V/agent.yaml" | head -1 | tr -d '"\r ')
          echo "model: $MODEL"
          echo "MODEL=$MODEL" >> $GITHUB_ENV
          ls kernel_*
      - name: Check the environment on Modal (no GPU)
        run: modal run local/modal_eval.py::solo_comprobar
      - name: Upload the data to the Modal volume (once for all containers)
        run: |
          modal volume create nervo-datos 2>/dev/null || true
          modal volume put nervo-datos data.tar "data-${{ github.run_id }}.tar" --force
      - name: Run on Modal
        run: |
          if [ "${{ inputs.wait }}" = "1" ]; then
            modal run local/modal_eval.py::main --kernel "$KERNELS" --datos "data-${{ github.run_id }}.tar" --modelo "$MODEL" --out output
          else
            modal run --detach local/modal_eval.py::main --kernel "$KERNELS" --datos "data-${{ github.run_id }}.tar" \
              --modelo "$MODEL" --esperar 0 --nombre "${{ inputs.label }}-${{ github.run_id }}"
          fi
      - name: Save results
        if: always()
        run: |
          mkdir -p results; found=0
          for f in output/*/output/nervo_results.json; do
            [ -f "$f" ] || continue; found=1
            i=$(echo "$f" | cut -d/ -f2)
            cp "$f" "results/${{ inputs.label }}-$i-modal-$(date -u +%Y%m%dT%H%M%SZ).json"
            python3 - "$f" <<'E'
          import json, sys
          r = json.load(open(sys.argv[1]))
          print('stage:', r.get('stage'), '| error:', r.get('error'))
          for t in r.get('tasks', []):
              print(('OK ' if t.get('resolved') else 'NO '), t.get('variant'), t['id'], 'calls', t.get('tool_calls'), 't', t.get('duration_s'), t.get('error') or '')
          E
          done
          if [ "$found" = 1 ]; then
            git config user.name "nervo-bot"; git config user.email "nervo-bot@users.noreply.github.com"
            git add results && git commit -m "Modal results: ${{ inputs.label }}" && git pull --rebase -q && git push -q || true
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: modal-output
          path: output
