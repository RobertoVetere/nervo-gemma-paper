# com_v3: public agent (community_base) with a different call plan: understand before editing
# (edit by call 18 at the latest, not 12, and no blind edits). Reason: in 54 traces of the public agent,
# first edit before call 13 -> 14/31 solved; from call 13 on -> 17/23. Everything else identical.
# Origen: the public community single agent
# ("gemma-4-harness-fixed-single-agent", Kaggle sample notebook), same tools as published,
# same sampling and budgets as nervo v4. Only the prompt differs.
name: swe_agent
model: gemma-4-e4b-it-qat-w4a16-ct
instruction: !include prompts/system.md
tools:
  - run_command
  - read_file
  - edit_file
  - write_file
  - get_status
  - submit_patch
  - get_code_neighbors
  - search_similar_code
  - get_code_subgraph
generate_content_config: !include configs/sampling.yaml
